name: nivara
description: "Nivara — civic intelligence app. Your City. Your Proof. Your Voice."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.40+40

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# run `flutter pub upgrade --major-versions`. Alternatively,
# manually update the version numbers below.
# Use `flutter pub outdated` to see what can be updated.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  sensors_plus: ^7.1.0
  geolocator: ^14.0.3
  crypto: ^3.0.7
  maplibre_gl: ^0.26.2
  image_picker: ^1.2.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_local_notifications: ^22.2.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.4
  simple_icons: ^16.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon — regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/nivara_icon.png"
  adaptive_icon_background: "#0A0F18"
  adaptive_icon_foreground: "assets/icon/nivara_icon_foreground.png"
  min_sdk_android: 21

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - .env
